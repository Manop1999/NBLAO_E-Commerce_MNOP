name: Deploy NB LAO E-Commerce to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Verify Git LFS images
        shell: bash
        run: |
          git lfs pull
          git lfs ls-files
          if grep -R -l "^version https://git-lfs.github.com/spec/v1" public; then
            echo "ERROR: Git LFS pointer files remain in public/"
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application
        run: pnpm build

      - name: Verify built images are not LFS pointers
        shell: bash
        run: |
          if grep -R -l "^version https://git-lfs.github.com/spec/v1" dist; then
            echo "ERROR: Git LFS pointer files found in dist/"
            exit 1
          fi
          if ! cmp -s dist/index.html dist/404.html; then
            echo "ERROR: dist/404.html SPA fallback is missing or differs from dist/index.html"
            exit 1
          fi

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
